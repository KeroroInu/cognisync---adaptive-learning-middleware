[tool.poetry]
name = "cognisync-backend"
version = "0.1.0"
description = "CogniSync Adaptive Learning Middleware - Backend API"
authors = ["CogniSync Team <contact@cognisync.dev>"]
readme = "README.md"
packages = [{include = "app"}]

# 注意：容器构建实际安装的是 requirements.txt（见 Dockerfile），本文件的依赖
# 声明需与其保持一致。以下版本区间对应 requirements.txt 中的锁定版本。
[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.128.6"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
pydantic = "^2.12.5"
pydantic-settings = "^2.12.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.46"}
asyncpg = "^0.31.0"
neo4j = "^6.1.0"
httpx = "^0.28.1"
python-dotenv = "^1.2.1"
python-multipart = "^0.0.20"
email-validator = "^2.3.0"
PyJWT = "^2.11.0"
bcrypt = "^5.0.0"
pytz = "^2025.2"
# 已移除 alembic / tenacity / openai：
# - alembic：项目未使用，schema 演进走 app/db/postgres.py 中的幂等迁移函数，
#   仓库内没有 alembic/ 目录和版本文件。
# - tenacity：重试逻辑手写在 llm_provider.py 与 chat.py 中，未引入该库。
# - openai：LLM 调用统一走 httpx 直连 OpenAI 兼容接口（见 llm_provider.py），
#   以便同时支持 DeepSeek / Ollama / LM Studio，未使用官方 SDK。

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
black = "^24.10.0"
ruff = "^0.8.4"
mypy = "^1.13.0"
httpx = "^0.28.1"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
