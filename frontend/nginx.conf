server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：所有路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        # HTML 与未带内容哈希的文件每次重验证，避免更新后仍打开旧入口。
        add_header Cache-Control "no-cache";
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pyodide 运行时（自托管，替代公共 CDN）。
    #
    # 必须显式声明 wasm MIME：nginx 默认 mime.types 里没有 application/wasm，
    # 会退化成 application/octet-stream，浏览器的流式编译随之失效。
    #
    # 注意 types 块是**整表替换**而非追加：只写 wasm 一条会让同目录下的
    # .js/.json/.zip 全部掉成 octet-stream。Worker 里的 importScripts()
    # 对 JavaScript MIME 有严格校验，pyodide.js 一旦是 octet-stream，
    # Chrome 会拒绝执行，学生在建构阶段直接卡死。所以这里必须把
    # 该目录用到的类型全部列全。
    #
    # 当前目录不含版本号，不能给 30 天免验证缓存；ETag 命中仍返回 304。
    location /pyodide/ {
        types {
            application/wasm                wasm;
            application/javascript          js mjs;
            application/json                json;
            application/zip                 zip;
            text/plain                      txt;
            application/octet-stream        ts;
        }
        default_type application/octet-stream;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    # wasm 不是压缩包。镜像构建时预压缩，避免全班首次加载时反复占 CPU。
    # 不含 application/zip：标准库 zip 保留原样。
    gzip_types text/plain text/css application/javascript application/json application/wasm;
}
