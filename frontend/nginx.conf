server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：所有路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pyodide 运行时（自托管，替代公共 CDN）。
    #
    # 必须显式声明 wasm MIME：nginx 默认 mime.types 里没有 application/wasm，
    # 会退化成 application/octet-stream，浏览器的流式编译随之失效。
    #
    # 注意 types 块是**整表替换**而非追加：只写 wasm 一条会让同目录下的
    # .js/.json/.zip 全部掉成 octet-stream。Worker 里的 importScripts()
    # 对 JavaScript MIME 有严格校验，pyodide.js 一旦是 octet-stream，
    # Chrome 会拒绝执行，学生在建构阶段直接卡死。所以这里必须把
    # 该目录用到的类型全部列全。
    #
    # 按版本号目录长缓存是安全的：升级 Pyodide 会换路径。
    location /pyodide/ {
        types {
            application/wasm                wasm;
            application/javascript          js mjs;
            application/json                json;
            application/zip                 zip;
            text/plain                      txt;
            application/octet-stream        ts;
        }
        default_type application/octet-stream;
        expires 30d;
        add_header Cache-Control "public";
        # python_stdlib.zip 与 .wasm 已是压缩格式，再 gzip 只费 CPU。
        gzip off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
