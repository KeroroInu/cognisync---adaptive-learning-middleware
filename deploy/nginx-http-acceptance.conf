# Temporary IP acceptance endpoint. Replace with TLS before collecting real data.
server {
    listen 80 default_server;
    server_name 124.222.152.227;
    server_tokens off;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ~ ^/(docs|redoc|openapi\.json)(/.*)?$ { return 404; }
    location ^~ /api/admin/auth/create-admin { return 404; }
    location = /slides { return 302 /slides/; }
    # Public software only: never place accounts, keys or student submissions here.
    location ^~ /downloads/sfls/ {
        alias /opt/sfls/installers/;
        autoindex off;
        sendfile on;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /slides/ {
        alias /opt/sfls/slides/current/;
        index 开始上课.html;
        charset utf-8;
        autoindex off;
    }
    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
