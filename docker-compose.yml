version: '3.8'

services:
  # ── 统一入口 Nginx 反向代理（单端口 8003）──────────────────
  nginx-proxy:
    image: nginx:alpine
    container_name: cognisync-proxy
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - admin-frontend
    networks:
      - cognisync-network

  # ── 后端 API ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognisync-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
      - ADMIN_KEY=${ADMIN_KEY:?Set ADMIN_KEY before starting the production stack}
      - POSTGRES_HOST=postgres
      - DATABASE_URL=
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    networks:
      - cognisync-network

  # ── 用户前端 ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cognisync-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - cognisync-network

  # ── 管理后台 ───────────────────────────────────────────────
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: cognisync-admin
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - cognisync-network

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: cognisync-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - ./backend/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cognisync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cognisync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j ──────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.15-community
    container_name: cognisync-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/cognisync_neo4j_2024}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - cognisync-network

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:

networks:
  cognisync-network:
    driver: bridge
