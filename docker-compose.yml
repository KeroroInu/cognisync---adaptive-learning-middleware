version: '3.8'

services:
  # ── 统一入口 Nginx 反向代理（单端口 8003）──────────────────
  nginx-proxy:
    image: nginx:alpine
    container_name: cognisync-proxy
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - admin-frontend
    networks:
      - cognisync-network

  # ── 后端 API ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # 构建期镜像源。默认空 = 走官方源，任何环境都能构建。
      # 国内服务器把这两个设成内网镜像可把构建从「几分钟甚至挂住」降到秒级。
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: cognisync-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
      - ADMIN_KEY=${ADMIN_KEY:?Set ADMIN_KEY before starting the production stack}
      - POSTGRES_HOST=postgres
      - DATABASE_URL=
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - cognisync-network

  # ── 用户前端 ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        PYODIDE_BASE_URL: ${PYODIDE_BASE_URL:-}
        APK_MIRROR: ${APK_MIRROR:-}
    container_name: cognisync-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - cognisync-network

  # ── 管理后台 ───────────────────────────────────────────────
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: cognisync-admin
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - cognisync-network

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: cognisync-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - ./backend/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cognisync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cognisync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j ──────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.15-community
    container_name: cognisync-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/cognisync_neo4j_2024}
      - NEO4J_PLUGINS=["apoc"]
      # Neo4j 5.x 配置名；显式约束 page cache，给 SQL、API 和操作系统留内存。
      # 这不是容器总内存上限，JVM / native buffers 仍需部署时实测。
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_INITIAL_SIZE:-512m}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_MAX_SIZE:-1G}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE_SIZE:-256m}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - cognisync-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:

networks:
  cognisync-network:
    driver: bridge
